<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ver video completo</title>

<style>
body{
    background:#121212;
    color:#fff;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
    padding:40px 20px;
}

.container{
    max-width:500px;
    margin:auto;
    margin-top:80px;
}

h1{
    font-size:28px;
}

p{
    color:#ccc;
    line-height:1.6;
}

.btn{
    display:inline-block;
    background:#FE2C55;
    color:#fff;
    text-decoration:none;
    padding:16px 30px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    margin-top:20px;
}

.small{
    margin-top:30px;
    font-size:13px;
    color:#888;
}
</style>

<script>

function abrirChrome() {

    var tiktokUrl = "https://www.tiktok.com/@dramasia1";

    try {

        window.location.href =
        "intent://" +
        tiktokUrl.replace("https://","") +
        "#Intent;scheme=https;package=com.android.chrome;end";

    } catch(e) {}

    setTimeout(function() {

        document.getElementById("manual").style.display = "block";

    }, 2000);
}

window.onload = function() {

    setTimeout(function() {
        abrirChrome();
    }, 500);

};

</script>

</head>
<body>

<div class="container">

    <h1>🎬 Ver video completo</h1>

    <p>
        Intentando abrir tu navegador...
    </p>

    <div id="manual" style="display:none;">

        <p>
            Si no se abrió automáticamente, pulsa el botón:
        </p>

        <a class="btn"
           href="intent://www.tiktok.com/@dramasia1#Intent;scheme=https;package=com.android.chrome;end">
            ABRIR EN CHROME
        </a>

        <br><br>

        <a class="btn"
           href="https://www.tiktok.com/@dramasia1">
            ABRIR TIKTOK WEB
        </a>

    </div>

    <div class="small">
        TikTok: @dramasia1
    </div>

</div>

</body>
</html>
