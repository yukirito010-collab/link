<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abriendo TikTok...</title>

    <meta property="al:android:url" content="snssdk1128://user/profile/7566838679873766422">
    <meta property="al:android:package" content="com.zhiliaoapp.musically">

    <meta property="al:ios:url" content="tiktok://user?username=dramasia1">
    <meta property="al:ios:app_store_id" content="1235601247">
    <meta property="al:ios:app_name" content="TikTok">

    <script>
        function openTikTok() {

            const isAndroid = /Android/i.test(navigator.userAgent);
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isAndroid) {

                window.location.href =
                    "intent://user/profile/7566838679873766422#Intent;scheme=snssdk1128;package=com.zhiliaoapp.musically;end";

                setTimeout(function () {
                    window.location.href = "https://www.tiktok.com/@dramasia1";
                }, 2000);

            } else if (isIOS) {

                window.location.href =
                    "tiktok://user?username=dramasia1";

                setTimeout(function () {
                    window.location.href = "https://www.tiktok.com/@dramasia1";
                }, 2000);

            } else {

                window.location.href = "https://www.tiktok.com/@dramasia1";
            }
        }

        window.onload = function () {
            setTimeout(openTikTok, 300);
        };
    </script>
</head>

<body style="
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding-top:100px;
">

    <h2>Abriendo TikTok...</h2>

    <p>
        Si TikTok no se abre automáticamente,
        pulsa el botón:
    </p>

    <button
        onclick="openTikTok()"
        style="
            background:#FE2C55;
            color:white;
            border:none;
            border-radius:25px;
            padding:15px 30px;
            font-size:18px;
            cursor:pointer;
        ">
        Abrir TikTok
    </button>

</body>
</html>
