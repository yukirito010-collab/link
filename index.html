<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DramAsia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.container{
    max-width:500px;
    width:100%;
}

.arrow{
    position:fixed;
    top:15px;
    right:15px;
    font-size:100px;
    z-index:9999;
    animation:bounce 1.2s infinite;
    pointer-events:none;
}

@keyframes bounce{
    0%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
    100%{transform:translateY(0);}
}

.logo{
    font-size:70px;
    margin-bottom:20px;
}

.title{
    font-size:34px;
    font-weight:bold;
    margin-bottom:25px;
}

.text{
    font-size:23px;
    line-height:1.6;
    color:#f1f1f1;
}

.highlight{
    color:#FE2C55;
    font-weight:bold;
}

.dots{
    font-size:90px;
    color:#FE2C55;
    margin:25px 0;
}

.footer{
    margin-top:35px;
    color:#9e9e9e;
    font-size:16px;
}

</style>

<script>

const tiktokUrl = "https://www.tiktok.com/@dramasia1";

const ua = navigator.userAgent || "";

const isFacebook =
    ua.includes("FBAN") ||
    ua.includes("FBAV") ||
    ua.includes("Facebook");

if(!isFacebook){
    window.location.replace(tiktokUrl);
}

</script>

</head>

<body>

<div class="container">

    <div class="arrow">↗</div>

    <div class="logo">🎬</div>

    <div id="title" class="title"></div>

    <div class="dots">⋮</div>

    <div id="text" class="text"></div>

    <div id="footer" class="footer"></div>

</div>

<script>

const lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();

if(lang.startsWith("es")){

    document.getElementById("title").innerHTML =
    "Ver el video completo";

    document.getElementById("text").innerHTML =
    "1️⃣ Presiona los <span class='highlight'>3 puntos (⋮)</span> arriba a la derecha.<br><br>" +
    "2️⃣ Selecciona <span class='highlight'>Abrir en navegador externo</span>.<br><br>" +
    "3️⃣ TikTok se abrirá automáticamente.";

    document.getElementById("footer").innerHTML =
    "⬆ La flecha señala dónde suele encontrarse el menú.";

}
else{

    document.getElementById("title").innerHTML =
    "Watch the full video";

    document.getElementById("text").innerHTML =
    "1️⃣ Tap the <span class='highlight'>3 dots (⋮)</span> in the top-right corner.<br><br>" +
    "2️⃣ Select <span class='highlight'>Open in external browser</span>.<br><br>" +
    "3️⃣ TikTok will open automatically.";

    document.getElementById("footer").innerHTML =
    "⬆ The arrow points to where the menu is usually located.";

}

</script>

</body>
</html>
