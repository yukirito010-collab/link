<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Abrir TikTok</title>

<script>
function abrirTikTok() {

    var ua = navigator.userAgent || "";

    if (/Android/i.test(ua)) {

        window.location.href =
        "intent://user/profile/7566838679873766422#Intent;scheme=snssdk1128;package=com.zhiliaoapp.musically;end";

        setTimeout(function() {
            window.location.href = "https://www.tiktok.com/@dramasia1";
        }, 1500);

    } else {

        window.location.href = "tiktok://user?username=dramasia1";

        setTimeout(function() {
            window.location.href = "https://www.tiktok.com/@dramasia1";
        }, 1500);
    }
}
</script>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding-top:100px;
}

button{
background:#fe2c55;
color:white;
border:none;
padding:18px 35px;
border-radius:30px;
font-size:20px;
font-weight:bold;
}
</style>

</head>
<body>

<h2>Abrir TikTok</h2>

<button onclick="abrirTikTok()">
ABRIR TIKTOK
</button>

</body>
</html>
